[package]
name = "securitycamera"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[lib]
name = "security_camera"
path = "src/lib.rs"

[[bin]]
name = "securitycamera"
path = "src/main.rs"

[dependencies]
alarmlog = { path = "../alarmlog" }
dailyreport = { path = "../dailyreport" }
detection = { path = "../detection" }
gif = { path = "../gif" }
my_video = { path = "../my_video" }
recorder = { path = "../recorder" }
streaming = { path = "../streaming" }

chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
ctrlc = "3"
hex = "0.4"
hmac = "0.12"
include_dir = "0.7"
jpeg-encoder = "0.6"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
ureq = { version = "2", features = ["json"] }
url = "2"
