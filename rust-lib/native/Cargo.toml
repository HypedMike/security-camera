[package]
name = "native"
version = "0.1.0"
edition = "2024"

# The one static library the Go program links: two Rust static libraries in
# one binary each bring their own copy of the Rust runtime and can clash.
[lib]
crate-type = ["staticlib"]

[dependencies]
alarmlog = { path = "../alarmlog" }
detection = { path = "../detection" }
gif = { path = "../gif" }
my_video = { path = "../my_video" }
recorder = { path = "../recorder" }
streaming = { path = "../streaming" }
